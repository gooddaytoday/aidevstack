name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run test suite
        run: make test

      - name: ShellCheck (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -a -x -P SCRIPTDIR -s sh scripts/install-zed-secure.sh \
            scripts/install-zed-no-ai.sh \
            scripts/install-zed-local-llm.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Windows PowerShell 5.1 (baseline)
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          .\tests\windows\Invoke-Tests.ps1

      - name: PowerShell 7 (compatibility leg)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser
          ./tests/windows/Invoke-Tests.ps1 -SkipAnalyzer
