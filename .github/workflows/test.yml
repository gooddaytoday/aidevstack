name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run test suite
        run: make test

      - name: ShellCheck (optional)
        continue-on-error: true
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/install-zed-secure.sh \
            scripts/zed-security-settings.sh \
            scripts/install-zed-no-ai.sh \
            scripts/install-zed-local-llm.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows PowerShell 5.1 (baseline)
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          .\tests\windows\Invoke-Tests.ps1

      - name: PowerShell 7 (compatibility leg)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          ./tests/windows/Invoke-Tests.ps1 -SkipAnalyzer
